services:
  web:
    image: gallery:latest
    container_name: app
    build:
      context: .
    ports:
      - "8011:8000"
#    env_file:
#      - .env
    volumes:
      - ./data:/app/data
    environment:
      REDIS_HOST: redis
    networks:
      - main
    depends_on:
      - redis


  worker:
    image: gallery:latest
    container_name: worker
    restart: unless-stopped
    entrypoint: ["/app/src/entrypoint-worker.sh"]
    environment:
      REDIS_HOST: redis
    volumes:
      - ./data:/app/data
#      - ./src:/app
    networks:
      - main
    depends_on:
      - redis


  redis:
    image: redis:7-alpine
    container_name: redis
#    ports:
#      - '6379:6379'
    networks:
      - main

networks:
  main:


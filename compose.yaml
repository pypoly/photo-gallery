services:
  web:
    image: "${APP_NAME}-gallery:latest"
    container_name: "${APP_NAME}-app"
    build:
      context: .
    ports:
      - "${APP_PORT}:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      REDIS_HOST: "${APP_NAME}-redis"
      POSTGRES_HOST: "${APP_NAME}-pg"
    networks:
      - main
    depends_on:
      - redis


  worker:
    image: "${APP_NAME}-gallery:latest"
    container_name: "${APP_NAME}-worker"
    restart: unless-stopped
    entrypoint: ["/app/src/entrypoint-worker.sh"]
    environment:
      REDIS_HOST: "${APP_NAME}-redis"
      POSTGRES_HOST: "${APP_NAME}-pg"
    volumes:
      - ./data:/app/data
#      - ./src:/app
    env_file:
      - .env
    networks:
      - main
    depends_on:
      - redis


  redis:
    image: redis:7-alpine
    container_name: "${APP_NAME}-redis"
#    ports:
#      - '6379:6379'
    networks:
      - main


  db:
    image: postgres:17-alpine
    container_name: "${APP_NAME}-pg"
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - main

networks:
  main:


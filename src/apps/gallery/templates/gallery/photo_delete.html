{% extends 'base.html' %}

{% block title %}Delete Post{% endblock %}

{% block content %}
    <h1>Удалить фото</h1>
    <p>Вы уверены, что хотите удалить фото?<strong>{{ object.title }}</strong></p>
    <form action="{% url 'gallery:delete_photo' pk=object.pk %}" method="POST">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Удалить</button>
    <a class="btn btn-secondary" href="{% url 'gallery:photo' pk=object.pk %}">Нет</a>
    </form>
{% endblock %}

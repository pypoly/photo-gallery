{% extends 'base.html' %}

{% block title %}Delete Post{% endblock %}

{% block content %}
    <h1>Удалить фото</h1>
    <p>Are you sure you want to delete "<strong>{{ object.title }}</strong>"?</p>
    <form action="{% url 'gallery:delete_photo' pk=object.pk %}" method="POST">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-secondary" href="{% url 'gallery:gallery' %}">Cancel</a>
    </form>
{% endblock %}

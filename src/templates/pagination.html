<div class="d-flex justify-content-center my-4">
    <nav aria-label="Пагинация">
        <ul class="pagination pagination-lg gap-1 mb-0">

            {% if page_obj.has_previous %}
                <li class="page-item">
                    <a class="page-link rounded-3 border-0 shadow-sm" href="?page={{ page_obj.previous_page_number }}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>
            {% else %}
                <li class="page-item disabled">
                    <span class="page-link rounded-3 border-0">
                        <i class="bi bi-chevron-left"></i>
                    </span>
                </li>
            {% endif %}

            {% for num in page_obj.paginator.page_range %}
                {% if page_obj.number == num %}
                    <li class="page-item active">
                        <span class="page-link rounded-3 border-0 shadow-sm fw-semibold">{{ num }}</span>
                    </li>
                {% else %}
                    <li class="page-item">
                        <a class="page-link rounded-3 border-0 shadow-sm" href="?page={{ num }}">{{ num }}</a>
                    </li>
                {% endif %}
            {% endfor %}

            {% if page_obj.has_next %}
                <li class="page-item">
                    <a class="page-link rounded-3 border-0 shadow-sm" href="?page={{ page_obj.next_page_number }}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            {% else %}
                <li class="page-item disabled">
                    <span class="page-link rounded-3 border-0">
                        <i class="bi bi-chevron-right"></i>
                    </span>
                </li>
            {% endif %}

        </ul>
    </nav>
</div>
